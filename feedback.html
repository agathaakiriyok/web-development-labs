<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы посетителей</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="feedback.css">
    <script src="js/feedback.js" defer></script>
</head>

<body>
<header class="header">
    <div class="wrapper header__wrapper">
        <div class="logo">
            <img src="img/logo.png" alt="Логотип Эрмитажа">
        </div>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
                <li class="nav__item"><a href="feedback.html" class="nav__link">Отзывы</a></li>
            </ul>
        </nav>
    </div>
</header>


<main class="main">
    <section class="feedback">
        <div class="wrapper">
            <h2 class="feedback__title">Отзывы посетителей</h2>

            <form class="feedback__form" id="feedbackForm">
                <label class="contacts__label">Имя:
                    <input type="text" name="name" id="name" required minlength="2">
                </label>

                <label class="contacts__label">Email:
                    <input type="email" name="email" id="email" required>
                </label>

                <label class="contacts__label">Отзыв:
                    <textarea name="message" id="message" required minlength="5"></textarea>
                </label>

                <button type="submit" class="contacts__btn">Добавить отзыв</button>
            </form>

            <template id="feedbackTemplate">
                <div class="feedback__item">
                    <p class="feedback__name"></p>
                    <p class="feedback__email"></p>
                    <p class="feedback__text"></p>
                    <button class="feedback__edit-btn">Редактировать</button>
                </div>
            </template>

            <div id="feedbackList" class="feedback__list"></div>

        </div>
    </section>
</main>

<footer class="footer">
    <div class="wrapper">
        <p class="footer__text">© 2025 Государственный Эрмитаж</p>
        <p class="footer__text">Дворцовая площадь, 2, Санкт-Петербург</p>
    </div>
</footer>
</body>
</html>
