<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Билеты — Эрмитаж</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header__logo"><a href="index.html"><img src="img/Hermitage_logo.png" alt="Логотип Эрмитажа" width="100"></a></div>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section class="tickets-page">
            <h1 class="tickets-page__title">Оформление билетов</h1>
            <form class="tickets-page__form">
                <label class="tickets-page__label">Количество:
                    <input type="number" name="quantity" min="1" value="1">
                </label>
                <label class="tickets-page__label">Цена за билет:
                    <input type="text" name="price" value="500 ₽" readonly>
                </label>
                <button type="submit" class="tickets-page__btn">Оплатить</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">© 2025 Государственный Эрмитаж</p>
    </footer>
</body>
</html>
