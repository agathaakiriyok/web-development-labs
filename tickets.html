<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Билеты</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
 
    <header class="header">
        <div class="wrapper header__wrapper">
            <div class="logo">
                <img src="img/logo.png" alt="Логотип Эрмитажа">
            </div>
            <nav class="nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
                    <li class="nav__item"><a href="about.html" class="nav__link">О музее</a></li>
                    <li class="nav__item"><a href="all-exhibitions.html" class="nav__link">Выставки</a></li>
                    <li class="nav__item"><a href="tickets.html" class="nav__link">Билеты</a></li>
                </ul>
            </nav>
        </div>
    </header>

<section class="tickets">
    <div class="wrapper">
        <h1>Покупка билетов</h1>

        <form class="tickets__form">
            <label class="tickets__label">
                Ваше имя:
                <input type="text" placeholder="Введите имя">
            </label>

            <label class="tickets__label">
                Email:
                <input type="email" placeholder="example@mail.com">
            </label>

            <label class="tickets__label">
                Тип билета:
                <select>
                    <option>Стандартный</option>
                    <option>Льготный</option>
                    <option>Экскурсионный</option>
                </select>
            </label>

            <button class="tickets__btn">Оформить</button>
        </form>
    </div>
</section>
<footer class="footer"></footer>
</body>
</html>
